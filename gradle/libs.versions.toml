[versions]
gradle = "9.7.1"
java = "26"
paper262 = "26.2.build.135-stable"
paper263 = "26.3.build.244-stable"
paperweight = "2.0.0-beta.24"
run-paper = "3.1.0"
gson = "2.14.0"
guice = "7.0.0"
hibernate = "7.2.24.Final"
flyway = "13.3.0"
postgresql = "42.7.12"
aws-sdk = "2.54.2"
zstd-jni = "1.5.7-15"
sshj = "0.40.0"
hikari = "7.0.2"
junit = "6.1.3"
junit-platform = "6.1.3"
mockbukkit262 = "4.117.0"
mockbukkit263 = "4.119.0"
packetevents = "2.14.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper262" }
paper-api263 = { module = "io.papermc.paper:paper-api", version.ref = "paper263" }
mockbukkit262 = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit262" }
mockbukkit263 = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.3", version.ref = "mockbukkit263" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guice = { module = "com.google.inject:guice", version.ref = "guice" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }

[plugins]
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
